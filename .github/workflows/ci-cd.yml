# .github/workflows/ci-cd.yml
name: Java CI/CD Pipeline

on:
  # Trigger on push to main branch and pull requests
  push:
    branches: [ main, wip ]
  pull_request:
    branches: [ main ]

jobs:
  # Continuous Integration Job
  test:
    runs-on: ubuntu-latest
    name: Test and Build

    # Add MySQL service for integration tests
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: homefinancedb_test
          MYSQL_USER: admin
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Java environment
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Wait for MySQL to be ready
      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h"127.0.0.1" -P"3306" --silent; do
            echo 'waiting for mysql...'
            sleep 1
          done

      # Run tests with test database
      - name: Run tests
        run: mvn clean test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/homefinancedb_test?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: admin
          SPRING_DATASOURCE_PASSWORD: password
          SPRING_PROFILES_ACTIVE: test

      # Generate test report
      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Maven Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit

      # Build the application
      - name: Build application
        run: mvn clean compile package -DskipTests

      # Run code quality checks (optional)
      - name: Run SpotBugs analysis
        run: mvn spotbugs:check
        continue-on-error: true

      # Build Docker image using your existing Dockerfile
      - name: Build Docker image
        run: |
          docker build -t homefinance:${{ github.sha }} .
          docker build -t homefinance:latest .

      # Save build artifacts
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-artifact
          path: target/*.jar

      # Upload Docker image (for deployment job)
      - name: Save Docker image
        run: docker save homefinance:latest | gzip > homefinance.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: homefinance.tar.gz

  # Security scanning job
  security:
    runs-on: ubuntu-latest
    needs: test
    name: Security Scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # OWASP dependency check
      - name: OWASP Dependency Check
        run: |
          mvn org.owasp:dependency-check-maven:check
        continue-on-error: true

      # Trivy security scanner for Docker image
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load < homefinance.tar.gz

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'homefinance:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # Continuous Deployment Job (only on main branch)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [test, security]
    name: Deploy to Staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: jar-artifact

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load < homefinance.tar.gz

      # Start services using docker-compose for integration testing
      - name: Start application with docker-compose
        run: |
          # Create a test docker-compose file
          docker-compose -f docker-compose.test.yml up -d

      # Deploy to staging environment using docker-compose
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Stop existing containers
          docker-compose -f docker-compose.staging.yml down || true
          # Start with new image
          docker-compose -f docker-compose.staging.yml up -d

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          sleep 30  # Wait for app and database to start
          curl -f http://localhost:8585/health || exit 1
          echo "Smoke tests passed!"

      - name: Notify team
        run: |
          echo "Deployment to staging successful!"
          # Add Slack/email notification here

  # Production deployment (manual approval required)
  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load < homefinance.tar.gz

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Deploy using docker-compose
          docker-compose -f docker-compose.prod.yml down || true
          docker-compose -f docker-compose.prod.yml up -d

      - name: Run production smoke tests
        run: |
          echo "Running production smoke tests..."
          sleep 30
          curl -f http://localhost:8585/health || exit 1

      - name: Notify team of production deployment
        run: |
          echo "Production deployment successful!"
          # Add notification logic
