<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Personal Finance Manager</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <style>
            body {
                background-color: #f8f9fa;
            }
            .navbar {
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            }
            .card {
                border: none;
                border-radius: 0.75rem;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            }
            .card-header {
                font-size: 1.25rem;
                font-weight: 600;
            }
            .btn-success {
                background-color: #28a745;
                border: none;
                transition: background-color 0.3s;
            }
            .btn-success:hover {
                background-color: #218838;
            }
            .table thead {
                background-color: #007bff;
                color: white;
            }
            .form-control:focus {
                box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
            }
        </style>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-light bg-white">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold text-primary" href="#">Finance Manager</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link active text-primary fw-bold" href="#" onclick="showPage('transactionContainer')">Transactions</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="#" onclick="showPage('dashboardContainer'); showChart('category')">Spending By Category</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" onclick="showPage('dashboardContainer'); showChart('merchant')">Top Merchants</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" onclick="showPage('dashboardContainer'); showChart('month')">Spending my month</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container-md" id="dashboardContainer" style="display:none;">
            <h2 class="text-center mb-4" id="chartTitle">Spending by Category</h2>
            <canvas id="chartCanvas"></canvas>
        </div>

        <div class="container mt-5" id="transactionContainer">
            <div class="row">
                <!-- Income & Expense Form -->
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header bg-primary text-white">
                            Add Income / Expense
                        </div>
                        <div class="card-body">
                            <form id="transaction-entry-form">
                                <div class="mb-3">
                                    <label for="entry-type" class="form-label">Type</label>
                                    <select class="form-select" id="entry-type" required>
                                        <option value="" disabled selected>Select type</option>
                                        <option value="INCOME">Income</option>
                                        <option value="EXPENSE">Expense</option>
                                        <option value="CARDPAYMENT">Card Payment</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="entry-date" class="form-label">Date</label>
                                    <input type="date" class="form-control" id="entry-date" required>
                                </div>
                                <div class="mb-3">
                                    <label for="entry-amount" class="form-label">Amount</label>
                                    <input type="number" class="form-control" id="entry-amount" placeholder="Enter amount" required>
                                </div>
                                <div class="mb-3">
                                    <label for="entry-account" class="form-label">Account</label>
                                    <select class="form-select" id="entry-account" required>
                                        <option value="" disabled selected>Select category</option>
                                        <option value="ASANKA">Asanka's personal</option>
                                        <option value="DIVYA">Divya's Personal</option>
                                        <option value="CIBC">CIBC - Shared</option>
                                        <option value="AMEX">AMEX - Shared</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="entry-entity" class="form-label">Account</label>
                                    <select class="form-select" id="entry-entity" required>
                                        <option value="" disabled selected>Select category</option>
                                        <option value="Cosco">Cosco</option>
                                        <option value="No Frills">No Frills</option>
                                        <option value="Freshco">Freshco</option>
                                        <option value="Indian">Indian</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="entry-category" class="form-label">Category</label>
                                    <select class="form-select" id="entry-category" required>
                                        <option value="" disabled selected>Select category</option>
                                        <option value="1">Utility Bill</option>
                                        <option value="2">Groceries</option>
                                        <option value="3">Transportation</option>
                                        <option value="4">Healthcare</option>
                                        <option value="5">Entertainment</option>
                                        <option value="6">Mortgage</option>
                                        <option value="7">Property tax</option>
                                        <option value="8">Insurance</option>
                                        <option value="9">Car repair</option>
                                        <option value="10">Home maintenance</option>
                                        <option value="11">Salary</option>
                                        <option value="12">Rental Income</option>
                                        <option value="13">Government Grants</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="entry-person" class="form-label">Person</label>
                                    <select class="form-select" id="entry-person" required>
                                        <option value="" disabled selected>Select Person</option>
                                        <option value="1">Asanka</option>
                                        <option value="2">Divya</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="entry-description" class="form-label">Description</label>
                                    <textarea class="form-control" id="entry-description" rows="2" placeholder="Optional description"></textarea>
                                </div>
                                <div class="mb-3">
                                    <label for="entry-receipt" class="form-label">Attach Receipt</label>
                                    <input type="file" class="form-control" id="entry-receipt" accept="image/*,application/pdf">
                                </div>
                                <button id="submit-btn" type="submit" class="btn btn-success w-100">Submit</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Summary Section -->
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header bg-primary text-white">
                            Summary
                        </div>
                        <div class="card-body text-center">
                            <h5 class="mb-3">Total Income: <span class="text-success fw-bold" id="total-income">$0.00</span></h5>
                            <h5 class="mb-3">Total Expenses: <span class="text-danger fw-bold" id="total-expenses">$0.00</span></h5>
                            <h5>Net Balance: <span class="text-info fw-bold" id="net-balance">$0.00</span></h5>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-md-12">
                    <div class="card">
                        <div class="card-header bg-primary text-white">
                            Recent Transactions
                        </div>
                        <div class="card-body">
                            <div class="row mb-1">
                                <div class="col-md-4 d-flex align-items-end">
                                    <button id="get-all-transactions-btn" class="btn btn-primary w-100">All Transactions</button>
                                </div>
                            </div>
                        </div>
                        <div class="card-body">
                            <!-- Date Filter Inputs -->
                            <div class="row mb-3">
                                <div class="col-md-4">
                                    <label for="show-start-date" class="form-label">Start Date:</label>
                                    <input type="date" id="show-start-date" class="form-control">
                                </div>
                                <div class="col-md-4">
                                    <label for="show-end-date" class="form-label">End Date:</label>
                                    <input type="date" id="show-end-date" class="form-control">
                                </div>
                                <div class="col-md-4 d-flex align-items-end">
                                    <button id="filter-btn" class="btn btn-primary w-100">Filter</button>
                                </div>
                            </div>

                            <table class="table table-hover" id="results-table">
                                <thead class="table-primary">
                                    <tr>
                                        <th>Date</th>
                                        <th>Type</th>
                                        <th>Amount</th>
                                        <th>Account</th>
                                        <th>Category</th>
                                    </tr>
                                </thead>
                                <tbody id="transactions-body">
                                <!-- Dynamically populated rows -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const form = document.getElementById("transaction-entry-form");

                // Handle Submit (POST)
                document.getElementById("submit-btn").addEventListener("click", function (e) {
                    e.preventDefault();

                    const data = {
                        transactionType: document.getElementById("entry-type").value,
                        date: document.getElementById("entry-date").value,
                        amount: document.getElementById("entry-amount").value,
                        account: document.getElementById("entry-account").value,
                        entity: document.getElementById("entry-entity").value,
                        category: document.getElementById("entry-category").value,
                        details: document.getElementById("entry-description").value,
                        person: document.getElementById("entry-person").value,
                    };
                    console.log("Payload JSON string:", JSON.stringify(data, null, 2));
                    fetch("/api/v1/transaction/saveTransaction", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(data)
                    })
                        .then(response => {
                            if (!response.ok) {
                                // Handle error response
                                return response.json().then(err => { throw err });
                            }
                            return response.json();
                        })
                        .then(data => {
                            alert("Saved successfully!");
                            form.reset();
                        })
                        .catch(error => {
                            console.error("Error saving data:", error);  // This will show proper error object
                            alert(error.error || "Failed to save data.");  // Show backend message if exists
                        });
                });

                // Handle Filter
                document.getElementById("filter-btn").addEventListener("click", function (e) {
                    e.preventDefault();

                    const params = new URLSearchParams({
                        start: document.getElementById("show-start-date").value,
                        end: document.getElementById("show-end-date").value,
                    });

                    console.log("Query Params I'm sending:", params.toString());

                    fetch("/api/v1/transaction/getTransactionsByDateRange?" + params.toString())
                        .then(response => response.json())
                        .then(data => {
                            const tableBody = document.querySelector("#results-table tbody");
                            tableBody.innerHTML = ""; // clear previous results

                            if (data.length === 0) {
                                tableBody.innerHTML = `<tr><td colspan="5" class="text-center">No records found</td></tr>`;
                                return;
                            }
                            console.log("Data from backend:", data);
                            console.log("Data from backend:", JSON.stringify(data, null, 2));
                            data.forEach(item => {
                                const row = `
                                    <tr>
                                        <td>${item.date}</td>
                                        <td>${item.transactionType}</td>
                                        <td>${item.amount}</td>
                                        <td>${item.account}</td>
                                        <td>${item.category}</td>
                                    </tr>
                                `;
                                tableBody.insertAdjacentHTML("beforeend", row);
                            });
                        })
                        .catch(error => {
                            console.error("Error fetching data:", error);
                            alert("Failed to fetch data.");
                        });
                });

                // Handle Get all transactions
                document.getElementById("get-all-transactions-btn").addEventListener("click", function (e) {
                    e.preventDefault();

                    fetch("/api/v1/transaction/getAllTransactions")
                        .then(response => response.json())
                        .then(data => {
                            console.log(data);  // Log the data to inspect its structure
                            const tableBody = document.querySelector("#results-table tbody");
                            tableBody.innerHTML = ""; // clear previous results

                            if (data.length === 0) {
                                tableBody.innerHTML = `<tr><td colspan="5" class="text-center">No records found</td></tr>`;
                                return;
                            }

                            data.forEach(item => {
                                const row = `
                                    <tr>
                                        <td>${item.type}</td>
                                        <td>${item.date}</td>
                                        <td>${item.amount}</td>
                                        <td>${item.name}</td>
                                        <td>${item.category}</td>
                                    </tr>
                                `;
                                tableBody.insertAdjacentHTML("beforeend", row);
                            });
                        })
                        .catch(error => {
                            console.error("Error fetching data:", error);
                            alert("Failed to fetch data.");
                        });
                });

            });

            function showPage(page) {
                document.getElementById('dashboardContainer').style.display = 'none';
                document.getElementById('transactionContainer').style.display = 'none';

                document.getElementById(page).style.display = 'block';
            }

            const ctx = document.getElementById('chartCanvas').getContext('2d');
            let currentChart;

            const chartsData = {
                category: {
                    title: 'Spending by Category',
                    type: 'bar',
                    labels: ['Food', 'Travel', 'Shopping', 'Bills', 'Entertainment'],
                    data: [500, 200, 300, 400, 150],
                },
                merchant: {
                    title: 'Top Merchants',
                    type: 'pie',
                    labels: ['Amazon', 'Walmart', 'Costco', 'Uber', 'Starbucks'],
                    data: [800, 600, 500, 300, 200],
                },
                month: {
                    title: 'Spending by Month (YTD)',
                    type: 'bar',
                    labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep'],
                    data: [1200, 1100, 1500, 1300, 1250, 1600, 1400, 1700, 1500],
                }
            };

            function showChart(type) {
                const chartInfo = chartsData[type];
                document.getElementById('chartTitle').innerText = chartInfo.title;

                document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
                event.target.classList.add('active');

                if (currentChart) {
                    currentChart.destroy();
                }

                currentChart = new Chart(ctx, {
                    type: chartInfo.type,
                    data: {
                        labels: chartInfo.labels,
                        datasets: [{
                            label: chartInfo.title,
                            data: chartInfo.data,
                            backgroundColor: [
                                '#0d6efd', '#6610f2', '#6f42c1', '#d63384', '#fd7e14',
                                '#20c997', '#198754', '#0dcaf0', '#ffc107'
                            ],
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                display: chartInfo.type === 'pie'
                            }
                        }
                    }
                });
            }

        </script>
    </body>
</html>
