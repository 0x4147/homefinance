version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: homefinance-mysql-staging
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=homefinancedb_staging
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=password
    ports:
      - "3306:3306"
    volumes:
      - mysql-staging-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--silent"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  homefinance:
    image: homefinance:latest
    container_name: homefinance-staging
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8585:8585"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/homefinancedb_staging?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_PROFILES_ACTIVE=staging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8585/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mysql-staging-data: